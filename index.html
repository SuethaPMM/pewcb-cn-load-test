ss=\"pewcb-site-header__pricing\" href=\"#EarlyBird\">价格<\/a><\/div><\/div><\/header>\n<!--\n  PewCB One — Hero block for a Tilda T123 HTML block.\n\n  Before publishing:\n  1. Upload outputs/pewcb-tilda-assets/pewcb-hero-removing-pcb-close.jpg to Tilda.\n  2. Replace the local image path in the <img> below with the Tilda CDN URL.\n  3. Set the T123 block's top and bottom padding to 0.\n-->\n\n\n\n\n\n\n\n\n<section class=\"pewcb-hero\" id=\"pewcb-one\" lang=\"zh-Hans\" aria-labelledby=\"pewcb-hero-title\">\n  <div class=\"pewcb-hero__container\">\n    <div class=\"pewcb-hero__layout\">\n      <div class=\"pewcb-hero__content\">\n        \n\n        <p class=\"pewcb-hero__eyebrow\">桌面 PCB 原型制作设备<\/p>\n        <h1 class=\"pewcb-hero__title\" id=\"pewcb-hero-title\"><strong>3+<\/strong> 轮 PCB 迭代<br>一天完成<\/h1>\n        <p class=\"pewcb-hero__copy\">\n          PewCB 将快速电路板原型制作带到您的桌面。省去等待板厂交付的时间，当天完成测试、修改并制作下一版硬件。\n        <\/p>\n\n        <div class=\"pewcb-hero__actions\" aria-label=\"主要操作\">\n          <a class=\"pewcb-hero__button pewcb-hero__button--primary\" href=\"#EarlyBird\">查看价格 →<\/a>\n          <a class=\"pewcb-hero__button pewcb-hero__button--secondary\" href=\"#contacts\" rel=\"noopener\" data-cn-channel=\"wechat\" data-contact-subject=\"技术交流与项目咨询\"><span class=\"cn-channel-icon\" aria-hidden=\"true\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-4 3v-6a7.5 7.5 0 0 1-1-4.5A7.5 7.5 0 0 1 8.5 4h4a7.5 7.5 0 0 1 7.5 7.5Z\" transform=\"translate(1 -1) scale(.95)\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><circle cx=\"7\" cy=\"10\" r=\"1\" fill=\"currentColor\"/><circle cx=\"12\" cy=\"10\" r=\"1\" fill=\"currentColor\"/><circle cx=\"17\" cy=\"10\" r=\"1\" fill=\"currentColor\"/><\/svg><\/span><span>联系 PewCB 团队<\/span><\/a>\n        <\/div>\n      <\/div>\n\n      <div class=\"pewcb-hero__visual\">\n        <figure class=\"pewcb-hero__figure\">\n          <!-- Replace this local path with the uploaded Tilda CDN URL. -->\n          <img class=\"pewcb-hero__image\" src=\"/pewcb-cn-load-test/assets/pewcb-hero-removing-pcb-close.webp?run=__PEWCB_FRESH_RUN__\" alt=\"工程师从 PewCB One 托盘中取出加工完成的 PCB\" width=\"1800\" height=\"1200\" fetchpriority=\"high\" decoding=\"async\" loading=\"eager\">\n        <\/figure>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!--\n  PewCB One — Detailed workflow block for Tilda T123.\n  Upload the five pewcb-workflow-*.jpg files from pewcb-tilda-assets to Tilda,\n  then replace the local src values below with their Tilda CDN URLs.\n-->\n\n\n\n\n\n\n\n\n<section class=\"pewcb-workflow\" id=\"workflow\" lang=\"zh-Hans\" aria-labelledby=\"pewcb-workflow-manifesto-title\">\n  <div class=\"pewcb-workflow__container\">\n    \n\n    <section class=\"pewcb-workflow__manifesto\">\n      <div class=\"pewcb-workflow__manifesto-copy\">\n        <p class=\"pewcb-workflow__manifesto-kicker\">一套连贯的桌面工作流程<\/p>\n        <h2 class=\"pewcb-workflow__manifesto-title\" id=\"pewcb-workflow-manifesto-title\">从设计到测试<\/h2>\n        \n        <p class=\"pewcb-workflow__manifesto-text\">以我们的气象站基准板为例，记录从导入 Gerber 文件到烧录固件的完整桌面制作流程。<\/p><p class=\"pewcb-workflow__manifesto-time\">30 分钟<\/p>\n      <\/div>\n      <figure class=\"pewcb-workflow__film\">\n        <video class=\"pewcb-workflow__video\" poster=\"/pewcb-cn-load-test/assets/pewcb-workflow-short-poster.webp?run=__PEWCB_FRESH_RUN__\" muted=\"\" loop=\"\" playsinline=\"\" preload=\"none\" aria-label=\"PewCB 电路板从预制基板到组装完成的原型\" data-lazy-src=\"/pewcb-cn-load-test/assets/pewcb-workflow-720.mp4?run=__PEWCB_FRESH_RUN__\"><\/video>\n      <\/figure>\n    <\/section>\n\n    <div class=\"pewcb-workflow__sequence\">\n      <article class=\"pewcb-workflow__step\">\n        <figure class=\"pewcb-workflow__figure\"><img class=\"pewcb-workflow__image\" src=\"/pewcb-cn-load-test/assets/pewcb-workflow-01-pewcb-app.webp?run=__PEWCB_FRESH_RUN__\" alt=\"PewCB 软件显示托盘中的电路板，并提示将基板正面朝上放入\" width=\"2560\" height=\"1440\" loading=\"eager\" decoding=\"async\"><\/figure>\n        <div class=\"pewcb-workflow__panel\">\n          <h3 class=\"pewcb-workflow__step-title\">导入并启动<\/h3>\n          <p class=\"pewcb-workflow__step-copy\">在 PewCB 软件中打开 Gerber 文件，将基板放入托盘，然后点击启动。<\/p>\n        <span class=\"pewcb-workflow__number\" aria-hidden=\"true\">01<\/span><\/div>\n      <\/article>\n      <article class=\"pewcb-workflow__step\">\n        <figure class=\"pewcb-workflow__figure\"><img class=\"pewcb-workflow__image\" src=\"/pewcb-cn-load-test/assets/pewcb-workflow-02-fabricate.webp?run=__PEWCB_FRESH_RUN__\" alt=\"PewCB 托盘中加工完成的 PCB 正面\" width=\"1600\" height=\"900\" loading=\"eager\" decoding=\"async\"><\/figure>\n        <div class=\"pewcb-workflow__panel\">\n          <h3 class=\"pewcb-workflow__step-title\">PCB 加工<\/h3>\n          <p class=\"pewcb-workflow__step-copy\">激光加工出走线、焊盘和电路板外形。加工背面时，将基板翻转后放回同一组定位销，两面的定位保持一致。<\/p><span class=\"pewcb-workflow__timing\"><strong>10 分钟<\/strong><\/span>\n        <span class=\"pewcb-workflow__number\" aria-hidden=\"true\">02<\/span><\/div>\n      <\/article>\n      <article class=\"pewcb-workflow__step\">\n        <figure class=\"pewcb-workflow__figure\"><img class=\"pewcb-workflow__image\" src=\"/pewcb-cn-load-test/assets/pewcb-workflow-03-stencil.webp?run=__PEWCB_FRESH_RUN__\" alt=\"在加工完成的 PCB 上原位切割锡膏模板\" width=\"1600\" height=\"900\" loading=\"eager\" decoding=\"async\"><\/figure>\n        <div class=\"pewcb-workflow__panel\">\n          <h3 class=\"pewcb-workflow__step-title\">制作模板并印刷锡膏<\/h3>\n          <p class=\"pewcb-workflow__step-copy\">将锡箔模板片包覆在电路板上。PewCB 在板上原位切出开孔，随后涂抹锡膏，再揭下模板。<\/p><span class=\"pewcb-workflow__timing\"><strong>5 分钟<\/strong><\/span>\n        <span class=\"pewcb-workflow__number\" aria-hidden=\"true\">03<\/span><\/div>\n      <\/article>\n      <article class=\"pewcb-workflow__step\">\n        <figure class=\"pewcb-workflow__figure\"><img class=\"pewcb-workflow__image\" src=\"/pewcb-cn-load-test/assets/pewcb-workflow-04-assemble.webp?run=__PEWCB_FRESH_RUN__\" alt=\"用镊子将元件放到刚加工完成的 PCB 上\" width=\"1600\" height=\"900\" loading=\"eager\" decoding=\"async\"><\/figure>\n        <div class=\"pewcb-workflow__panel\">\n          <h3 class=\"pewcb-workflow__step-title\">元件贴装<\/h3>\n          <p class=\"pewcb-workflow__step-copy\">用镊子手工放置元件，无需贴片机。<\/p><span class=\"pewcb-workflow__timing\"><strong>10 分钟<\/strong><\/span>\n        <span class=\"pewcb-workflow__number\" aria-hidden=\"true\">04<\/span><\/div>\n      <\/article>\n      <article class=\"pewcb-workflow__step\">\n        <figure class=\"pewcb-workflow__figure\"><img class=\"pewcb-workflow__image\" src=\"/pewcb-cn-load-test/assets/pewcb-workflow-05-reflow.webp?run=__PEWCB_FRESH_RUN__\" alt=\"刚完成贴装的 PCB 在小型加热台上进行回流焊\" width=\"1600\" height=\"900\" loading=\"eager\" decoding=\"async\"><\/figure>\n        <div class=\"pewcb-workflow__panel\">\n          <h3 class=\"pewcb-workflow__step-title\">回流焊接<\/h3>\n          <p class=\"pewcb-workflow__step-copy\">使用小型加热台进行回流焊，陶瓷基板升温快、受热均匀。焊后用异丙醇清洁。<\/p><span class=\"pewcb-workflow__timing\"><strong>5 分钟<\/strong><\/span>\n        <span class=\"pewcb-workflow__number\" aria-hidden=\"true\">05<\/span><\/div>\n      <\/article>\n      <article class=\"pewcb-workflow__step\">\n        <figure class=\"pewcb-workflow__figure\"><img class=\"pewcb-workflow__image\" src=\"/pewcb-cn-load-test/assets/pewcb-workflow-06-test.webp?run=__PEWCB_FRESH_RUN__\" alt=\"运行中的气象站基准板，电子墨水屏显示温度和湿度\" width=\"1600\" height=\"900\" loading=\"eager\" decoding=\"async\"><\/figure>\n        <div class=\"pewcb-workflow__panel\">\n          <h3 class=\"pewcb-workflow__step-title\">烧录与测试<\/h3>\n          <p class=\"pewcb-workflow__step-copy\">烧录固件，在真实硬件上测试，再开始下一轮迭代。图示为我们的气象站基准板，含 24 个贴片元件。<\/p>\n        <p class=\"pewcb-workflow__next\">今天就开始下一轮迭代。<\/p><a class=\"pewcb-workflow__button pewcb-workflow__button--primary pewcb-workflow__step-cta home-workflow-link\" href=\"#EarlyBird\">查看价格 →<\/a><span class=\"pewcb-workflow__number\" aria-hidden=\"true\">06<\/span><\/div>\n      <\/article>\n    <\/div>\n\n    \n  <\/div>\n<\/section>\n\n\n<!-- Full original process film, encoded for web playback. Upload the matching local MP4 when publishing. -->\n\n\n\n\n\n<!--\n  PewCB One — precision and optical calibration block for Tilda T123.\n  Upload pewcb-precision-tray-closeup.jpg from pewcb-tilda-assets to Tilda,\n  then replace the local src below with its Tilda CDN URL.\n-->\n\n\n\n\n\n\n\n\n<section class=\"pewcb-precision\" id=\"Precision\" lang=\"zh-Hans\" aria-labelledby=\"pewcb-precision-title\">\n  <div class=\"pewcb-precision__container\">\n    <header class=\"pewcb-precision__header\">\n      <h2 class=\"pewcb-precision__title\" id=\"pewcb-precision-title\">满足现代 PCB 的精度需求。<\/h2>\n    <p class=\"pewcb-precision__lead\">可用于包含 0.5 mm 及更小引脚间距 QFN 封装、高密度数字电路和 0201 无源元件的贴片电路板原型。<\/p><\/header>\n\n    <dl class=\"pewcb-precision__metrics\" aria-label=\"PewCB 加工精度参数\">\n      <div class=\"pewcb-precision__metric\"><dt>激光光斑<\/dt><dd>35 µm<\/dd><\/div>\n      <div class=\"pewcb-precision__metric\"><dt>重复定位精度<\/dt><dd>30 µm<\/dd><\/div>\n      <div class=\"pewcb-precision__metric\"><dt>分辨率<\/dt><dd>2 µm<\/dd><\/div>\n      <div class=\"pewcb-precision__metric\"><dt>线宽<\/dt><dd>75 µm<\/dd><\/div>\n      <div class=\"pewcb-precision__metric\"><dt>线距<\/dt><dd>75 µm<\/dd><\/div>\n    <\/dl>\n\n    \n\n    <div class=\"pewcb-precision__feature\">\n      <figure class=\"pewcb-precision__figure\">\n        <img class=\"pewcb-precision__image\" src=\"/pewcb-cn-load-test/assets/pewcb-precision-tray-closeup.webp?run=__PEWCB_FRESH_RUN__\" alt=\"位于 PewCB 托盘中的 PCB，展示精细走线和焊盘\" width=\"1600\" height=\"1067\" loading=\"eager\" decoding=\"async\">\n      <\/figure>\n      <div class=\"pewcb-precision__copy\">\n        <h3 class=\"pewcb-precision__feature-title\">自动光学校准。<\/h3>\n        <p class=\"pewcb-precision__feature-text\">出厂校准使用 32 个传感器修正镜头畸变。每次加工前，平台上的 8 个传感器会补偿托盘定位偏差和热漂移。<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<!--\n  PewCB One — Production Quality block for a Tilda T123 HTML block.\n\n  Upload the referenced files from outputs/pewcb-tilda-assets to Tilda,\n  replace the relative paths with Tilda CDN URLs, and set T123 padding to 0.\n-->\n\n\n\n\n\n\n\n\n<section class=\"pewcb-bga\" id=\"BGA\" aria-labelledby=\"pewcb-bga-title\"><div class=\"pewcb-bga__container\"><div class=\"pewcb-bga__layout\"><div><h2 id=\"pewcb-bga-title\">探索标称规格之外的能力<\/h2><h3 class=\"pewcb-bga__subtitle\">2 × 2 mm BGA，全部引脚单层扇出。<\/h3><p class=\"pewcb-bga__copy\">BGA 单层扇出、0201 电阻和 1 × 1 mm 可寻址 LED，均由 PewCB One 制作并手工组装。恢复阻焊层后，这些微小元件可在回流焊时自行对中。<\/p><dl class=\"pewcb-bga__facts\"><div><dt>BGA 封装尺寸<\/dt><dd>2×2 mm<\/dd><\/div><div><dt>演示板线宽<\/dt><dd>50 µm<\/dd><\/div><div><dt>演示板线距<\/dt><dd>≈70 µm<\/dd><\/div><\/dl><p class=\"pewcb-bga__note\">标称 75 µm 线宽和线距留有性能余量，属于保证规格。该工艺的物理极限约为 25 µm。<\/p><\/div><figure><div class=\"rev-media rev-media--bga\" data-media-src=\"/pewcb-cn-load-test/assets/pewcb-bga-demo-zh-20261025.mp4?run=__PEWCB_FRESH_RUN__\" aria-label=\"带解说的 PewCB BGA 原型制作演示\"><img class=\"rev-media__poster\" src=\"/pewcb-cn-load-test/assets/pewcb-bga-thumbnail-zh.webp?run=__PEWCB_FRESH_RUN__\" alt=\"PewCB One BGA 演示：15 分钟桌面制板，50 µm 线宽，2 × 2 mm BGA\" width=\"1920\" height=\"1080\" loading=\"eager\" decoding=\"async\"><button class=\"rev-media__play\" type=\"button\" aria-label=\"播放 BGA 演示\"><svg viewBox=\"0 0 16 18\" aria-hidden=\"true\"><path d=\"M1 1v16l14-8z\"><\/path><\/svg><\/button><\/div><\/figure><\/div><\/div><\/section><section class=\"pewcb-quality\" id=\"ProductionQuality\" lang=\"zh-Hans\" aria-labelledby=\"pewcb-quality-title\">\n  <div class=\"pewcb-quality__container\"><header class=\"pewcb-quality__header\">\n      \n      <h2 class=\"pewcb-quality__title\" id=\"pewcb-quality-title\">接近工厂品质的原型板<\/h2>\n      <p class=\"pewcb-quality__lead\">精心选择的基板材料，让走线和焊盘质量接近板厂制作的 PCB，并可在桌面当天完成。配合原位切割的锡膏模板，实现准确的锡膏印刷和整洁、一致的焊点。<\/p>\n    <\/header><div class=\"pewcb-quality__details\" aria-label=\"PewCB 测试板全貌与微距细节\"><figure class=\"pewcb-quality__detail pewcb-quality__detail--traces\"><button class=\"pewcb-quality__zoom\" type=\"button\" aria-label=\"查看不同尺寸元件的照片\"><img class=\"pewcb-quality__detail-image\" src=\"/pewcb-cn-load-test/assets/pewcb-quality-traces.webp?run=__PEWCB_FRESH_RUN__\" alt=\"PewCB 原型板上的不同尺寸元件和走线\" loading=\"eager\" decoding=\"async\" width=\"1600\" height=\"900\"><\/button><\/figure><figure class=\"pewcb-quality__detail pewcb-quality__detail--components\"><button class=\"pewcb-quality__zoom\" type=\"button\" aria-label=\"查看高密度电源区域照片\"><img class=\"pewcb-quality__detail-image\" src=\"/pewcb-cn-load-test/assets/pewcb-quality-components.webp?run=__PEWCB_FRESH_RUN__\" alt=\"PewCB 原型板上的高密度电源区域\" loading=\"eager\" decoding=\"async\" width=\"1600\" height=\"900\"><\/button><\/figure><figure class=\"pewcb-quality__detail pewcb-quality__detail--board\"><button class=\"pewcb-quality__zoom\" type=\"button\" aria-label=\"查看完整测试板照片\"><img class=\"pewcb-quality__detail-image\" src=\"/pewcb-cn-load-test/assets/pewcb-quality-board.webp?run=__PEWCB_FRESH_RUN__\" alt=\"完整的 PewCB 测试板，包含不同线宽、不同尺寸元件和 USB-C 接口\" width=\"1400\" height=\"1414\" loading=\"eager\" decoding=\"async\"><\/button><\/figure><figure class=\"pewcb-quality__detail pewcb-quality__detail--fine-pitch\"><button class=\"pewcb-quality__zoom\" type=\"button\" aria-label=\"查看细间距集成电路照片\"><img class=\"pewcb-quality__detail-image\" src=\"/pewcb-cn-load-test/assets/pewcb-quality-fine-pitch.webp?run=__PEWCB_FRESH_RUN__\" alt=\"细间距集成电路及整洁的焊点\" loading=\"eager\" decoding=\"async\" width=\"1600\" height=\"900\"><\/button><\/figure><figure class=\"pewcb-quality__detail pewcb-quality__detail--pads\"><button class=\"pewcb-quality__zoom\" type=\"button\" aria-label=\"查看锡膏印刷后的焊盘照片\"><img class=\"pewcb-quality__detail-image\" src=\"/pewcb-cn-load-test/assets/pewcb-quality-pads.webp?run=__PEWCB_FRESH_RUN__\" alt=\"通过模板印刷锡膏后的焊盘\" loading=\"eager\" decoding=\"async\" width=\"1600\" height=\"900\"><\/button><\/figure><figure class=\"pewcb-quality__detail pewcb-quality__detail--spacing\"><button class=\"pewcb-quality__zoom\" type=\"button\" aria-label=\"查看密集走线照片\"><img class=\"pewcb-quality__detail-image\" src=\"/pewcb-cn-load-test/assets/pewcb-quality-spacing.webp?run=__PEWCB_FRESH_RUN__\" alt=\"两排细间距焊盘之间的密集走线\" loading=\"eager\" decoding=\"async\" width=\"1400\" height=\"788\"><\/button><\/figure><\/div><\/div>\n\n  \n<div class=\"pewcb-quality__lightbox\" role=\"dialog\" aria-modal=\"true\" aria-label=\"PCB 放大照片\" aria-hidden=\"true\">\n    <button class=\"pewcb-quality__lightbox-close\" type=\"button\" aria-label=\"关闭放大照片\">×<\/button>\n    <button class=\"pewcb-quality__lightbox-nav pewcb-quality__lightbox-prev\" type=\"button\" aria-label=\"上一张\">‹<\/button>\n    <img class=\"pewcb-quality__lightbox-image\" alt=\"PewCB 原型板细节放大图\" width=\"1920\" height=\"1080\" loading=\"eager\" decoding=\"async\">\n    <button class=\"pewcb-quality__lightbox-nav pewcb-quality__lightbox-next\" type=\"button\" aria-label=\"下一张\">›<\/button>\n  <\/div><\/section>\n\n\n\n\n\n\n<!-- PewCB — Blanks homepage block for Tilda T123. Set T123 padding to 0. -->\n\n\n\n\n\n\n\n<section class=\"pewcb-blanks\" id=\"Blanks\" lang=\"zh-Hans\" aria-labelledby=\"pewcb-blanks-title\">\n  <div class=\"pewcb-blanks__container\">\n    <header class=\"pewcb-blanks__header\">\n      \n      <h2 class=\"pewcb-blanks__title\" id=\"pewcb-blanks-title\">预制基板<\/h2><h3 class=\"rev-section-subtitle\">自带层间连接的预制陶瓷基板<\/h3>\n    <\/header>\n\n    <div class=\"pewcb-blanks__layout\">\n      <figure class=\"pewcb-blanks__visual\" aria-label=\"PewCB 基板结构\">\n        <picture class=\"pewcb-blanks__picture\">\n          <source media=\"(max-width:767px)\" srcset=\"/pewcb-cn-load-test/assets/pewcb-blank-diagram-mobile.svg?run=__PEWCB_FRESH_RUN__\" width=\"640\" height=\"760\">\n          <source media=\"(max-width:1199px)\" srcset=\"/pewcb-cn-load-test/assets/pewcb-blank-diagram-tablet.svg?run=__PEWCB_FRESH_RUN__\" width=\"1050\" height=\"780\">\n          <img class=\"pewcb-blanks__diagram\" src=\"/pewcb-cn-load-test/assets/pewcb-blank-diagram-desktop.svg?run=__PEWCB_FRESH_RUN__\" alt=\"PewCB 基板分层示意图，展示放大的金属化过孔以及阻焊层、铜箔和陶瓷基材标注\" width=\"1400\" height=\"720\" loading=\"eager\" decoding=\"async\">\n        <\/picture>\n        <span class=\"pewcb-blanks__diagram-label pewcb-blanks__diagram-label--via\">预制金属化过孔<\/span>\n        <span class=\"pewcb-blanks__diagram-label pewcb-blanks__diagram-label--mask\">阻焊层<\/span>\n        <span class=\"pewcb-blanks__diagram-label pewcb-blanks__diagram-label--copper\">铜箔<\/span>\n        <span class=\"pewcb-blanks__diagram-label pewcb-blanks__diagram-label--ceramic\">陶瓷基材<\/span>\n      <\/figure>\n\n      <div class=\"pewcb-blanks__copy\">\n   <p class=\"pewcb-blanks__text\">PewCB 基板由双面铜箔、陶瓷基材、预先涂覆的阻焊层和金属化过孔阵列组成。层间连接已预先完成。<\/p>\n   <p class=\"pewcb-blanks__text\">使用配套 eCAD 模板，将走线连接到已有过孔。18 µm 铜箔在焊接和返修过程中保持牢固附着。基板尺寸范围为 23 × 23 至 84 × 84 mm。<\/p>\n   <p class=\"pewcb-blanks__text\">需要额外的层间连接？PewCB One 可用激光加工附加孔，再手工安装金属铆眼。<\/p><\/div>\n    <\/div>\n\n    <div class=\"pewcb-shapes\" id=\"CustomShapes\" aria-labelledby=\"pewcb-shapes-title\">\n      <div class=\"pewcb-shapes__copy\">\n        <h3 class=\"pewcb-shapes__title\" id=\"pewcb-shapes-title\">自定义外形，组装后分板。<\/h3>\n        <p class=\"pewcb-shapes__text\">用激光切出所需外形、孔洞和开窗，也可先加工 V 形刻槽，组装完成后再掰开拼板。<\/p>\n        \n        <dl class=\"pewcb-shapes__facts\">\n          <div><dt>电路板外形<\/dt><dd>自由外形<\/dd><\/div>\n          <div><dt>分板方式<\/dt><dd>切穿或 V 形刻槽<\/dd><\/div>\n          <div><dt>小尺寸电路板<\/dt><dd>拼板制作<\/dd><\/div>\n        <\/dl>\n        <div class=\"pewcb-shapes__links\"><a class=\"pewcb-shapes__link\" href=\"https://cn.pewcb.com/made-on/v-scoring.html\">查看电路板与加工过程 <span aria-hidden=\"true\">→<\/span><\/a><\/div>\n      <\/div>\n      <div class=\"pewcb-shapes__gallery\">\n        <figure class=\"pewcb-shapes__figure\">\n          <img class=\"pewcb-shapes__image\" src=\"/pewcb-cn-load-test/assets/pewcb-vscore-before.webp?run=__PEWCB_FRESH_RUN__\" alt=\"尚未分离的 PewCB LED 板，带有激光切割的圆形开口，以及分隔边条的 V 形刻槽\" width=\"1200\" height=\"1200\" loading=\"eager\" decoding=\"async\">\n          <figcaption><strong>分板前。<\/strong> 一整片基板：已切出孔和大圆形开窗，三侧设有 V 形刻槽。<\/figcaption>\n        <\/figure>\n        <figure class=\"pewcb-shapes__figure\">\n          <img class=\"pewcb-shapes__image\" src=\"/pewcb-cn-load-test/assets/pewcb-vscore-after.webp?run=__PEWCB_FRESH_RUN__\" alt=\"同一块基板沿 V 形刻槽分离，形成 LED 板和三条边条\" width=\"1200\" height=\"1200\" loading=\"eager\" decoding=\"async\">\n          <figcaption><strong>分板后。<\/strong> 沿刻槽掰开，得到所需外形的电路板。<\/figcaption>\n        <\/figure>\n      <\/div>\n    <\/div><div class=\"home-blanks-action\"><a class=\"pewcb-blanks__button\" href=\"https://cn.pewcb.com/blanks/index.html\">了解预制基板 <span aria-hidden=\"true\">→<\/span><\/a><\/div>\n  <\/div>\n<\/section>\n\n\n<!-- PewCB — Stencils homepage block for Tilda T123. Set T123 padding to 0. -->\n\n\n\n\n\n\n\n<section class=\"pewcb-stencils\" id=\"Stencils\" lang=\"zh-Hans\" aria-labelledby=\"pewcb-stencils-title\">\n  <div class=\"pewcb-stencils__container\"><div class=\"rev-stencils-intro\"><div class=\"rev-stencils-story\"><header class=\"pewcb-stencils__header\">\n      \n      <h2 class=\"pewcb-stencils__title\" id=\"pewcb-stencils-title\">锡膏模板<\/h2><h3 class=\"rev-section-subtitle\">原位切割，自然对准<\/h3>\n    <\/header><div class=\"pewcb-stencils__copy\">\n   <p class=\"pewcb-stencils__text\">将一次性模板片固定在加工完成的 PCB 上，再放回 PewCB One。激光根据 Gerber 锡膏层文件，在焊盘正上方切出开孔。<\/p>\n   <p class=\"pewcb-stencils__text\">切割和涂抹锡膏时，模板始终固定在电路板上，无需手工对位、框架或定位夹具。涂好锡膏，揭下模板，即可放置元件。<\/p>\n   <a class=\"pewcb-stencils__button\" href=\"https://cn.pewcb.com/stencils/index.html\">了解锡膏模板 <span aria-hidden=\"true\">→<\/span><\/a><\/div><\/div><figure class=\"pewcb-stencils__material\"><div class=\"pewcb-video\" role=\"group\" data-pewcb-video=\"/pewcb-cn-load-test/assets/pewcb-stencil-zh-20261025-v2.mp4?run=__PEWCB_FRESH_RUN__\" aria-label=\"PewCB One 锡膏模板制作与使用流程\"><img class=\"pewcb-video__poster\" src=\"/pewcb-cn-load-test/assets/pewcb-stencils-thumbnail-zh.webp?run=__PEWCB_FRESH_RUN__\" width=\"1280\" height=\"720\" alt=\"锡膏模板：原位对准，电路板上已准确印刷锡膏\" loading=\"eager\" decoding=\"async\"><button class=\"pewcb-video__play\" type=\"button\" aria-label=\"播放锡膏模板演示\"><svg viewBox=\"0 0 16 18\" aria-hidden=\"true\"><path d=\"M1 1v16l14-8z\"><\/path><\/svg><\/button><\/div><\/figure><\/div>\n    \n\n    \n\n    \n  <\/div>\n<\/section>\n\n\n\n<!-- PewCB — Desktop Lab homepage block for Tilda T123. Set T123 padding to 0. -->\n\n\n\n\n\n\n\n<section class=\"pewcb-lab\" id=\"DesktopLab\" lang=\"zh-Hans\" aria-labelledby=\"pewcb-lab-title\">\n  <div class=\"pewcb-lab__container\">\n    \n\n    <div class=\"pewcb-lab__content\"><div class=\"pewcb-lab__intro\">\n      <header class=\"pewcb-lab__header\">\n        \n        <h2 class=\"pewcb-lab__title\" id=\"pewcb-lab-title\">桌面上的 PCB 实验室。<\/h2>\n      <\/header>\n      <div class=\"pewcb-lab__copy\">\n        <p class=\"pewcb-lab__lead\">一套可放在日常工作台上的独立系统。接入普通电源插座即可，无需单独的化学处理区、外接排风、压缩空气或真空管路。<\/p>\n      <\/div>\n    <p class=\"home-lab-dimensions\">155 × 290 × 464 mm <span>·<\/span> 15 kg<\/p><p class=\"home-lab-safety\">1 类封闭式激光设备，仅在联锁托盘关闭后运行。可通过内置摄像头观察加工过程。<\/p><\/div>\n      <figure class=\"pewcb-lab__demo\" id=\"process-film\" aria-label=\"PewCB One 制作流程演示\"><div class=\"pewcb-video\" role=\"group\" data-pewcb-video=\"/pewcb-cn-load-test/assets/pewcb-desktop-zh-20261025-v4.mp4?run=__PEWCB_FRESH_RUN__\" aria-label=\"工作台上的 PewCB One\"><img class=\"pewcb-video__poster\" src=\"/pewcb-cn-load-test/assets/pewcb-desktop-thumbnail-zh.webp?run=__PEWCB_FRESH_RUN__\" width=\"1280\" height=\"720\" alt=\"PewCB One 与电脑共同放置在日常工作台上\" loading=\"eager\" decoding=\"async\"><button class=\"pewcb-video__play\" type=\"button\" aria-label=\"播放桌面使用演示\"><svg viewBox=\"0 0 16 18\" aria-hidden=\"true\"><path d=\"M1 1v16l14-8z\"><\/path><\/svg><\/button><\/div><\/figure>\n\n      \n    <\/div>\n  <section class=\"home-filter\" id=\"Filtration\" aria-labelledby=\"home-filter-title\"><figure><img src=\"/pewcb-cn-load-test/assets/home-filtration.webp?run=__PEWCB_FRESH_RUN__\" width=\"1400\" height=\"1025\" loading=\"eager\" decoding=\"async\" alt=\"从 PewCB One 中抽出内置过滤模块进行维护\"><\/figure><div class=\"home-filter__copy\"><p class=\"home-eyebrow\">内置过滤系统<\/p><h3 id=\"home-filter-title\">空气净化后循环使用。<\/h3><p>PewCB One 内置四级闭环过滤系统。空气依次经过可清洗钢网、G4 和 F7 纤维滤材及活性炭，再返回加工腔体。<\/p><div class=\"home-filter__stages\" aria-label=\"四级过滤结构\"><div><span>01<\/span>钢制滤网<\/div><div><span>02<\/span>G4 过滤层<\/div><div><span>03<\/span>F7 过滤层<\/div><div><span>04<\/span>活性炭<\/div><\/div><p class=\"home-filter__service\">软件会跟踪滤材负载，并在需要维护时提醒。过滤模块可方便取出，进行清洁和滤材更换。<\/p><\/div><\/section><\/div>\n<\/section><section class=\"home-software\" id=\"Software\" aria-labelledby=\"home-software-title\"><div class=\"home-software__container\">\n<header class=\"home-section-head\"><h2 id=\"home-software-title\">PewCB 软件<\/h2><\/header>\n<div class=\"home-app-layout\">\n<figure class=\"home-app-preview\"><video class=\"home-loop home-app-video\" data-loop-src=\"/pewcb-cn-load-test/assets/home-app-first-pass.mp4?run=__PEWCB_FRESH_RUN__\" poster=\"/pewcb-cn-load-test/assets/home-app-first-pass-poster.webp?run=__PEWCB_FRESH_RUN__\" muted=\"\" loop=\"\" playsinline=\"\" preload=\"none\" width=\"1600\" height=\"842\" role=\"button\" tabindex=\"0\" aria-label=\"播放动画\" aria-description=\"PewCB 软件中的首轮电路板加工，原速播放\"><\/video><\/figure>\n<div class=\"home-app-copy\"><p>PewCB 软件直观易用，从打开 Gerber 文件到制作锡膏模板，引导您完成整个加工流程。可预览电路板，并按照每一步的清晰提示操作。<\/p><p>通过 USB 将 PewCB One 连接到 Windows 电脑。切换到内置摄像头，即可查看封闭加工腔内的真实电路板。<\/p><div class=\"home-app-download\"><a class=\"pewcb-hero__button pewcb-hero__button--primary\" href=\"#contacts\" data-cn-channel=\"appDownload\" data-contact-subject=\"获取 Windows 版 PewCB 软件\">获取 Windows 版软件 <span aria-hidden=\"true\">→<\/span><\/a><\/div><\/div>\n<\/div><\/div><\/section>\n\n\n\n<!--\n  PewCB — Direct engineering contact section for Tilda T123.\n\n  The form uses the same Tilda receivers and field variable names as the\n  published PewCB forms. Publish the page after inserting this block.\n\n  The long-form workflow film has its own section immediately after Workflow.\n-->\n\n\n\n\n\n\n\n\n\n\n\n<!-- PewCB — Functional Prototyping homepage block for Tilda T123. Set T123 padding to 0. -->\n\n\n\n\n\n\n\n<section class=\"pewcb-functional\" id=\"Functional\" lang=\"zh-Hans\" aria-labelledby=\"pewcb-functional-title\">\n  <div class=\"pewcb-functional__container\">\n    <div class=\"pewcb-functional__hero\">\n      <div class=\"pewcb-functional__copy\">\n        \n        <h2 class=\"pewcb-functional__title\" id=\"pewcb-functional-title\">功能原型验证<\/h2><h3 class=\"rev-section-subtitle\">快速试错，让想法落地<\/h3>\n        <p class=\"pewcb-functional__lead\">研发团队不必在等待一周的板厂制作周期前，花大量时间反复确认每一个设计决定。想法出现后就能尝试，在真实硬件上快速验证和改进。PewCB 降低了试错成本，让这样的研发节奏成为可能。<\/p>\n      <\/div>\n      <figure class=\"pewcb-functional__visual\">\n        <img class=\"pewcb-functional__visual-image\" src=\"/pewcb-cn-load-test/assets/pewcb-functional-prototype-hand.webp?run=__PEWCB_FRESH_RUN__\" alt=\"用 PewCB 制作的紧凑型传感器原型，可单手握持\" width=\"1050\" height=\"1400\" loading=\"eager\" decoding=\"async\">\n      <\/figure>\n\n      <div class=\"pewcb-functional__validation\">\n        <h3 class=\"pewcb-functional__validation-title\">尽早验证，稳步推进<\/h3>\n        <p class=\"pewcb-functional__text\">工程师可将电压转换器、传感器或电机控制器等关键子系统，分别制作成快速加工的小板。独立完善各项功能，尽早确认性能，再将验证过的模块整合进最终产品。<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"pewcb-functional__process\" aria-label=\"功能原型验证流程\">\n      <div class=\"pewcb-functional__step\"><span class=\"pewcb-functional__number\">01<\/span><strong class=\"pewcb-functional__step-title\">构思<\/strong><span class=\"pewcb-functional__step-text\">从一个想法或子系统开始<\/span><\/div>\n      <div class=\"pewcb-functional__step\"><span class=\"pewcb-functional__number\">02<\/span><strong class=\"pewcb-functional__step-title\">设计<\/strong><span class=\"pewcb-functional__step-text\">绘制原理图并完成 PCB 布局布线<\/span><\/div>\n      <div class=\"pewcb-functional__step\"><span class=\"pewcb-functional__number\">03<\/span><strong class=\"pewcb-functional__step-title\">制作<\/strong><span class=\"pewcb-functional__step-text\">约 10 分钟完成 PCB 加工<\/span><\/div>\n      <div class=\"pewcb-functional__step\"><span class=\"pewcb-functional__number\">04<\/span><strong class=\"pewcb-functional__step-title\">测试<\/strong><span class=\"pewcb-functional__step-text\">立即在真实硬件上验证<\/span><\/div>\n      <div class=\"pewcb-functional__step\"><span class=\"pewcb-functional__number\">05<\/span><strong class=\"pewcb-functional__step-title\">整合<\/strong><span class=\"pewcb-functional__step-text\">将已验证的硬件模块整合到最终产品中<\/span><\/div>\n    <\/div>\n\n    <div class=\"pewcb-functional__toolbox\">\n      <div class=\"pewcb-functional__toolbox-head\">\n        <h3 class=\"pewcb-functional__toolbox-title\">为研发工具箱增添一种可能<\/h3>\n        <p class=\"pewcb-functional__text\">正如 3D 打印机已成为机械原型制作的重要工具，PewCB 也让更多日常研发任务变得可行。当约 30 分钟后就能拿到下一块电路板，转接板、引脚引出板、一次性测试夹具、测量辅助板和接口转换板都能成为随手可用的工具。<\/p>\n        <p class=\"pewcb-functional__text\">PewCB One 不替代 PCB 工厂，量产电路板仍应交由板厂制作。它减少的是研发中断的代价：从产生想法到能动手验证之间的漫长等待。<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n\n      <figure class=\"pewcb-functional__toolbox-visual\">\n        <img class=\"pewcb-functional__toolbox-image\" src=\"/pewcb-cn-load-test/assets/pewcb-toolbox-boards.webp?run=__PEWCB_FRESH_RUN__\" alt=\"各类转接板、引脚引出板、测试夹具和研发辅助工具\" width=\"1400\" height=\"636\" loading=\"eager\" decoding=\"async\">\n      <\/figure>\n<\/section><section class=\"made-teaser\" id=\"MadeOnPewCB\" aria-labelledby=\"made-on-title\"><div class=\"made-teaser__container\"><div class=\"made-teaser__head\"><div><h2 id=\"made-on-title\">PewCB 制作案例<\/h2><p>来自我们工程团队的实用原型与加工实验，展示电路板、制作过程和结果。<\/p><\/div><a class=\"made-teaser__link\" href=\"https://cn.pewcb.com/made-on/index.html\">查看全部案例 →<\/a><\/div><div class=\"made-teaser__grid\"><article class=\"made-teaser__card\"><a href=\"https://cn.pewcb.com/made-on/mini-weather-station.html\" tabindex=\"-1\" aria-hidden=\"true\"><img src=\"/pewcb-cn-load-test/assets/pewcb-functional-prototype-hand.webp?run=__PEWCB_FRESH_RUN__\" alt=\"\" width=\"1200\" height=\"900\" loading=\"eager\" decoding=\"async\" class=\"home-board-complete\"><\/a><div class=\"made-teaser__copy\"><small>功能原型<\/small><h3><a href=\"https://cn.pewcb.com/made-on/mini-weather-station.html\">迷你气象站<\/a><\/h3><p>24 个贴片元件，从准备好的 Gerber 文件到烧录固件，约 30 分钟。<\/p><a class=\"made-teaser__link\" href=\"https://cn.pewcb.com/made-on/mini-weather-station.html\" aria-label=\"查看迷你气象站案例\">查看案例 →<\/a><\/div><\/article><article class=\"made-teaser__card\"><a href=\"https://cn.pewcb.com/made-on/tiny-bga.html\" tabindex=\"-1\" aria-hidden=\"true\"><img src=\"/pewcb-cn-load-test/assets/pewcb-quality-after.webp?run=__PEWCB_FRESH_RUN__\" alt=\"\" width=\"1200\" height=\"900\" loading=\"eager\" decoding=\"async\" class=\"home-board-complete\"><\/a><div class=\"made-teaser__copy\"><small>细间距加工实验<\/small><h3><a href=\"https://cn.pewcb.com/made-on/tiny-bga.html\">2 × 2 mm BGA，全部引脚单层扇出。<\/a><\/h3><p>50 µm 线宽、约 70 µm 线距，一项超出标称规格的加工实验。<\/p><a class=\"made-teaser__link\" href=\"https://cn.pewcb.com/made-on/tiny-bga.html\" aria-label=\"查看 2 × 2 mm BGA 全引脚扇出案例\">查看案例 →<\/a><\/div><\/article><article class=\"made-teaser__card\"><a href=\"https://cn.pewcb.com/made-on/v-scoring.html\" tabindex=\"-1\" aria-hidden=\"true\"><img src=\"/pewcb-cn-load-test/assets/pewcb-vscore-after.webp?run=__PEWCB_FRESH_RUN__\" alt=\"\" width=\"1200\" height=\"900\" loading=\"eager\" decoding=\"async\" class=\"home-board-complete\"><\/a><div class=\"made-teaser__copy\"><small>加工工艺实验<\/small><h3><a href=\"https://cn.pewcb.com/made-on/v-scoring.html\">自定义外形，刻槽分板。<\/a><\/h3><p>在 1 mm 陶瓷上进行切穿加工与 V 形刻槽。<\/p><a class=\"made-teaser__link\" href=\"https://cn.pewcb.com/made-on/v-scoring.html\" aria-label=\"查看外形切割与刻槽分板案例\">查看案例 →<\/a><\/div><\/article><\/div><\/div><\/section><style>.made-teaser{color:#242627;background:#f2f3f5;padding:clamp(56px,6.4vw,92px) 0;font-family:Poppins,Arial,sans-serif}.made-teaser *{box-sizing:border-box}.made-teaser__container{width:min(1200px,calc(100% - 64px));margin:auto}.made-teaser__head{display:flex;align-items:end;justify-content:space-between;gap:32px;margin-bottom:32px}.made-teaser h2{font-size:clamp(32px,3.5vw,46px);font-weight:400;line-height:1.14;letter-spacing:-.035em;margin:0 0 20px}.made-teaser p{color:#626b73;line-height:1.65;margin:0;max-width:620px}.made-teaser__link{color:#ff3500!important;font-size:14px;white-space:nowrap;text-decoration:none}.made-teaser__link:hover{text-decoration:underline;text-underline-offset:4px}.made-teaser__grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.made-teaser__card{min-width:0;background:white;border-radius:4px}.made-teaser__card img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:4px 4px 0 0}.made-teaser__card:first-child img{object-position:center 58%}.made-teaser__copy{padding:24px}.made-teaser__copy small{font-size:11px;letter-spacing:.08em;color:#626b73;text-transform:uppercase}.made-teaser h3{font-size:21px;font-weight:400;line-height:1.35;letter-spacing:-.025em;margin:12px 0 16px}.made-teaser__copy p{font-size:14px;margin-bottom:20px}.made-teaser a{color:inherit;text-decoration:none}.made-teaser a:focus-visible{outline:2px solid #ff3500;outline-offset:4px}@media(max-width:767px){.made-teaser__container{width:calc(100% - 40px)}.made-teaser__head{display:block}.made-teaser__head>.made-teaser__link{display:inline-block;margin-top:20px}.made-teaser__grid{grid-template-columns:1fr;gap:24px}.made-teaser__copy{padding:24px}.made-teaser__card img{aspect-ratio:4/3}}.made-teaser__card{display:flex;flex-direction:column}.made-teaser__copy{flex:1;display:flex;flex-direction:column}.made-teaser__copy>.made-teaser__link{margin-top:auto;align-self:flex-start}<\/style><link rel=\"stylesheet\" href=\"/pewcb-cn-load-test/assets/site-menu.css?run=__PEWCB_FRESH_RUN__\"><script src=\"/pewcb-cn-load-test/assets/site-menu.js?run=__PEWCB_FRESH_RUN__\" defer=\"\"><\/script><link rel=\"stylesheet\" href=\"/pewcb-cn-load-test/assets/material-links.css?v=20261007-2&amp;run=__PEWCB_FRESH_RUN__\">\n\n\n<!-- PewCB — Education block for Tilda T123. Set T123 padding to 0. -->\n\n\n\n\n\n\n\n<section class=\"pewcb-education\" id=\"Education\" lang=\"zh-Hans\" aria-labelledby=\"pewcb-education-title\">\n  <div class=\"pewcb-education__container\">\n    <div class=\"pewcb-education__hero\">\n      <div class=\"pewcb-education__copy\">\n        \n        <h2 class=\"pewcb-education__title\" id=\"pewcb-education-title\">教育应用<\/h2><h3 class=\"rev-section-subtitle\">一堂实验课，从想法到硬件<\/h3>\n        <p class=\"pewcb-education__text\">学生可在一堂实验课内完成 PCB 的设计、制作、组装、编程和测试。<\/p>\n        <p class=\"pewcb-education__text\">减少等待，让学生在知识仍然清晰时，通过真实硬件验证想法、修改设计并完成整个学习闭环。<\/p>\n      <\/div>\n      <figure class=\"pewcb-education__visual\">\n        <img class=\"pewcb-education__image\" src=\"/pewcb-cn-load-test/assets/pewcb-education-operation.webp?run=__PEWCB_FRESH_RUN__\" alt=\"工程师在实验室工作台前操作 PewCB One\" width=\"1600\" height=\"1067\" loading=\"eager\" decoding=\"async\">\n      <\/figure>\n    <\/div>\n\n    <div class=\"pewcb-education__features\" aria-label=\"教学价值\">\n      <article class=\"pewcb-education__feature\">\n        <h3 class=\"pewcb-education__feature-title\">工程思维<\/h3>\n        <p class=\"pewcb-education__feature-text\">在真实设计中学习。布线错误、电源完整性问题和固件缺陷，都能成为可以动手测试和修正的实践课题。<\/p>\n      <\/article>\n      <article class=\"pewcb-education__feature\">\n        <h3 class=\"pewcb-education__feature-title\">完整的实验流程<\/h3>\n        <p class=\"pewcb-education__feature-text\"><span class=\"pewcb-education__cycle\">EDA 设计 ➔ PCB 制作 ➔ 组装 ➔ 固件 ➔ 测试。<\/span>在工作台上完成整个流程，带着能运行的原型结束实验。<\/p>\n      <\/article>\n      <article class=\"pewcb-education__feature\">\n        <h3 class=\"pewcb-education__feature-title\">适合教学环境<\/h3>\n        <p class=\"pewcb-education__feature-text\">封闭式激光加工腔和内置四级过滤系统，为课堂、大学实验室及其他教学场景提供支持。<\/p>\n      <\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- PewCB — PewFabs (coming soon). Replace the map placeholder with the interactive map embed when it is ready. -->\n<section class=\"pewcb-fabs\" id=\"PewFabs\" lang=\"zh-Hans\" aria-labelledby=\"pewcb-fabs-title\">\n  <div class=\"pewcb-fabs__container\">\n    <div class=\"pewcb-fabs__layout\">\n      <div class=\"pewcb-fabs__copy\">\n        <p class=\"pewcb-fabs__badge\">社区制板网络<\/p>\n        <h2 class=\"pewcb-fabs__title\" id=\"pewcb-fabs-title\">PewFabs<\/h2>\n        <h3 class=\"pewcb-fabs__subtitle\">桌面 PCB 制作社区网络<\/h3>\n        <p class=\"pewcb-fabs__lead\">PewCB One 具有足够的精度和重复性，让设备用户也能为他人制作电路板。我们正在建设 PewFabs，将快速原型制作带给更多人，而不仅是已经拥有设备的用户。<\/p>\n        <div class=\"pewcb-fabs__cards\">\n          <article class=\"pewcb-fabs__card\">\n            <h4 class=\"pewcb-fabs__card-title\">已经拥有 PewCB One？<\/h4>\n            <p class=\"pewcb-fabs__card-text\">申请加入 PewFabs，帮助附近的工程师、学生和创客将设计变成真实电路板。<\/p>\n          <\/article>\n          <article class=\"pewcb-fabs__card\">\n            <h4 class=\"pewcb-fabs__card-title\">还没有设备？<\/h4>\n            <p class=\"pewcb-fabs__card-text\">联系我们，了解附近可提供桌面制板服务的合作伙伴，制作您的第一块电路板。<\/p>\n          <\/article>\n        <\/div>\n        <p class=\"pewcb-fabs__mission\">每个人都能更快迭代，硬件创新就能更快前进。PewFabs 希望让这样的社区不断壮大。<\/p>\n        <div class=\"pewcb-fabs__actions\"><a class=\"pewcb-fabs__button pewcb-fabs__button--primary\" href=\"mailto:welcome@pewcb.com?subject=PewFabs%20partnership\">咨询 PewFabs 合作 <span aria-hidden=\"true\">→<\/span><\/a><\/div>\n      <\/div>\n      <figure class=\"pewcb-fabs__map home-fabs-map\"><div class=\"cn-network-panel\"><span class=\"cn-eyebrow\">PewFabs<\/span><h3>让桌面制板<br>连接更多工程师<\/h3><p>寻找可提供制板服务的合作伙伴，或让您的 PewCB One 帮助更多人。<\/p><a href=\"https://cn.pewcb.com/network/index.h
